name: Temporary public SKPORT Threat catalog probe
on:
  push:
    branches:
      - feature/endfield-threats-matrix-countdown-pages-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe publicly accessible official wiki enemy catalog only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          urls=[
            "https://wiki.skport.com/endfield/catalog?mainTypeId=1&subTypeId=3&filterIds=&header=0",
            "https://zonai.skport.com/web/v1/wiki/item/catalog?typeMainId=1&typeSubId=3",
            "https://zonai.skport.com/web/v1/wiki/item/catalog?mainTypeId=1&subTypeId=3",
            "https://zonai.skport.com/web/v1/wiki/item/catalog?typeMainId=1&typeSubId=4",
            "https://endfield.wiki.gg/wiki/Category:Bosses",
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Origin":"https://wiki.skport.com","Referer":"https://wiki.skport.com/"})
              with urllib.request.urlopen(req,timeout=10) as r:
                data=r.read(26000).decode("utf-8","replace")
                print("CHECK",url,"STATUS",r.status,"LEN",len(data),"BODY",repr(data[:330]))
            except Exception as exc:
              print("CHECK",url,"ERROR",repr(exc)[:300])
          PY
