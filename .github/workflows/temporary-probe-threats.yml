name: Temporary official SKPORT Threats snapshot import
on:
  push:
    branches: [feature/endfield-threats-matrix-countdown-pages-20261019]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install importer requirements
        run: |
          python3 -m pip install -q playwright pillow
          python3 -m playwright install chromium
      - name: Import 100 percent official public Threats catalog and optimize cover art
        run: python3 scripts/endfield/import-threats-wiki.py
      - name: Commit official snapshot and image cache only to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/endfield/catalog/threats.json public/images/endfield/threats/
          if ! git diff --cached --quiet; then
            git commit -m "data(endfield): verified SKPORT Threat catalog snapshot and optimized Threat portraits"
            git push origin HEAD:feature/endfield-threats-matrix-countdown-pages-20261019
          fi
