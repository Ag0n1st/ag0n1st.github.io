name: Reconcile exact Gear crate contents against SKPORT and independent sources
on:
  push:
    branches: [endfield-exact-gear-locations-20261015]
    paths:
      - src/lib/endfield/preciseBlueprints.mjs
      - scripts/endfield/build-precise-blueprints.mjs
      - .github/workflows/reconcile-precise-blueprints.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/endfield/build-precise-blueprints.mjs
      - run: |
          npm run test:endfield
          node scripts/endfield/check-budget.mjs
          npm run build
      - name: Store reconciled item-level evidence on feature branch
        shell: bash
        run: |
          git add src/data/endfield/progression/blueprint-precise-gear-index.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Index piece-specific Gear Crate locations and preserve disputed evidence'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
