name: One-time Si Datafield scenario tabs
on:
  push:
    branches: [feature-si-complete-guide-20261016]
    paths: [.github/workflows/audit-si-datafield-tabs.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Source-isolated read-only Datafield Si profile scenario audit
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            pg=b.new_page(viewport={"width":1460,"height":980})
            try:
              response=pg.goto("https://datafield.cc/characters/si",wait_until="domcontentloaded",timeout=60000)
              pg.wait_for_timeout(6500)
              print("SI_DF_STATUS",response.status if response else None)
              try:pg.get_by_role("button",name="×").first.click(timeout=1200)
              except Exception:pass
              def section():
                s=pg.locator("body").inner_text()
                a=s.find("Potentials\\n")
                k=s.find("Recommended Weapons",a)
                t=s.find("Recommended Gear Sets",k)
                print("SI_DF_SCENARIO",s[a:t if t>k else a+12000][:16000])
              section()
              for target in ["Support Potentials","DPS Potentials","Support","Main DPS"]:
                try:
                  pg.get_by_role("button",name=target,exact=True).first.click(timeout=3500)
                  pg.wait_for_timeout(450)
                  print("SELECT",target);section()
                except Exception as e:print("CLICK_FAILED",target,str(e)[:240])
              try:
                pg.get_by_role("button",name="Show 6 More Weapons").first.click(timeout=4000)
                print("ALL_WEAPONS",pg.locator("body").inner_text()[pg.locator("body").inner_text().find("Recommended Weapons"):][:9000])
              except Exception as e:print("EXPAND_FAILED",str(e)[:250])
            finally:b.close()
          PY
