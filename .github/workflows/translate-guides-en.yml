name: Generate complete EN operator editorial snapshots

on:
  push:
    branches: [feature-global-en-parity-20261017]
    paths: [".github/workflows/translate-guides-en.yml", "scripts/endfield/translate-operator-guides.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install offline translator and YAML parser
        run: |
          python -m pip install 'argostranslate>=1.9,<2' 'PyYAML>=6,<7'
      - name: Translate original editorial data (no website runtime requests)
        run: python scripts/endfield/translate-operator-guides.py
      - name: Check output and preserve all original game/build/team identifiers
        run: |
          python - <<'PY'
          import json
          a=json.load(open("src/data/i18n/en-guide-content.json"))
          assert set(a["guides"])=={"liino","typhoeus","si"}
          for slug,guide in a["guides"].items():
            assert len(guide["overview"]["summary"])>80
            assert len(guide["teams"]["meta"])>=2
            assert len(guide["equipment"]["builds"])>=4
          print("Complete EN guide editorial snapshots validated")
          PY
      - name: Commit generated static translations to feature branch only
        run: |
          git add src/data/i18n/en-guide-content.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add complete English editorial guide snapshots for all existing operators"
            git fetch origin feature-global-en-parity-20261017
            git rebase origin/feature-global-en-parity-20261017
            git push origin HEAD:feature-global-en-parity-20261017
          fi
