name: Temporary official threat catalog probe
on:
  push:
    branches: ["feature/endfield-threats-matrix-leaderboard-cheatsheets-20261019"]
    paths:
      - "scripts/endfield/probe-threats.py"
      - ".github/workflows/probe-threats.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/endfield/probe-threats.py
