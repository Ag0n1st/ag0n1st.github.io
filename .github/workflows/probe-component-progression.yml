name: Audit Endfield official crafting component IDs
on:
  push:
    branches: [endfield-component-progression-20261015]
    paths:
      - scripts/endfield/probe-component-progression.mjs
      - .github/workflows/probe-component-progression.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/endfield/probe-component-progression.mjs
