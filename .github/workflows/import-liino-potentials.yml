name: Import Liino Potential Snapshots (one-time)

on:
  push:
    branches: [feature-liino-kit-overview-potentials-20261016]
    paths: [.github/workflows/import-liino-potentials.yml]

permissions:
  contents: write

jobs:
  import_images:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary WebP optimizer
        run: npm install --no-save --package-lock=false sharp
      - name: Download 3 validated public Liino snapshots and optimize WebP
        run: node scripts/endfield/import-liino-potentials.mjs
      - name: Enforce existing 100 MB Endfield project budget
        run: node scripts/endfield/check-budget.mjs
      - name: Commit only three bounded WebP images to feature branch
        shell: bash
        run: |
          git add public/images/endfield/operators/liino/potentials/potential-{1,3,5}.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cache compressed Liino potential snapshots P1 P3 P5"
          git push origin HEAD:feature-liino-kit-overview-potentials-20261016
