name: Cache verified official Endfield portraits and icons
on:
  push:
    branches: [feature/endfield-nav-speedruns-countdown-artworks-20261017]
    paths:
      - scripts/endfield/import-official-operator-artworks.py
      - .github/workflows/import-official-operator-artworks.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    if: github.repository == 'Ag0n1st/ag0n1st.github.io'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Map and download publicly verifiable card portrait + detail icon pairs
        run: python scripts/endfield/import-official-operator-artworks.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/endfield/check-budget.mjs
      - name: Commit artwork only to current feature branch, never main
        shell: bash
        run: |
          git add public/images/endfield/operators/ src/data/endfield/catalog/operator-official-artwork.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets(endfield): cache verified GRYPHLINE portraits and icons in WebP"
            git pull --rebase origin feature/endfield-nav-speedruns-countdown-artworks-20261017
            git push origin HEAD:feature/endfield-nav-speedruns-countdown-artworks-20261017
          fi
