name: Import all public SKPORT operator profiles (anonymous)
on:
  push:
    branches: [feature-skport-public-operator-bulk-import-20261024]
    paths:
      - ".github/workflows/import-skport-public-operators.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install anonymous browser and WebP optimizer
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright sharp
          npx playwright install --with-deps chromium
      - name: Import validated public SKPORT details and bounded WebPs
        run: node scripts/endfield/import-public-skport-all.mjs
      - name: Enforce 100 MB Endfield limit
        run: node scripts/endfield/check-budget.mjs
      - name: Validate imported data and Astro build
        run: |
          npm run test:endfield
          npm run build
          node scripts/check-pages-budget.mjs
      - name: Commit only normalized official game data and optimized WebPs
        shell: bash
        run: |
          git add src/data/endfield/operators/ src/data/endfield/catalog/operator-public-import-report.json
          git add public/images/endfield/operators/
          if git diff --cached --quiet; then
            echo "No verified new public data to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import validated public SKPORT operator details and WebP assets"
          git fetch origin feature-skport-public-operator-bulk-import-20261024
          git rebase origin/feature-skport-public-operator-bulk-import-20261024
          git push origin HEAD:feature-skport-public-operator-bulk-import-20261024
