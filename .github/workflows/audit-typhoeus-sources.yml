name: One-time Typhoeus research audit
on:
  push:
    branches: [feature-typhoeus-complete-guide-20261016]
    paths: [.github/workflows/audit-typhoeus-sources.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing official SKPORT catalog and Typhoeus data, no remote gameplay values
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const items=JSON.parse(fs.readFileSync("src/data/endfield/catalog/items.json","utf8")).items;
          const extras=JSON.parse(fs.readFileSync("src/data/endfield/operators/typhoeus.extra.json","utf8"));
          const ops=JSON.parse(fs.readFileSync("src/data/endfield/operators/typhoeus.json","utf8"));
          console.log("OPERATOR",JSON.stringify(ops.operator));
          console.log("TALENTS",JSON.stringify(extras.talents));
          console.log("POTENTIALS",JSON.stringify(extras.potentials));
          console.log("SKILLS",JSON.stringify(ops.skills.map(s=>({slot:s.slot,head:s.name,firstMetrics:s.metrics.slice(0,7).map(m=>[m[0],m[1],m.at(-1)])}))));
          console.log("ITEMS",JSON.stringify(items.filter(x=>x.categories.includes("Weapons")&&/Umbra of Frigid Eventide|Suffering's End|Detonation Unit|Monaihe/i.test(x.name)||x.categories.includes("Gear")&&/Deep Rampart|LYNX|Eternal Xiranite|Pulser Labs|Hot Work|Qingbo|Bonekrusha|Rift Trekker/.test(x.name)).map(x=>({id:x.id,name:x.name,icon:x.iconPath}))));
          const eq=JSON.parse(fs.readFileSync("src/data/endfield/catalog/equipment-details.json","utf8"));
          console.log("GEAR_ROWS",JSON.stringify(eq.gear.filter(x=>/Deep Rampart|LYNX Slab|Eternal Xiranite Bracing Slab|Pulser Labs|Hot Work/.test(x.name)).map(x=>({id:x.id,name:x.name,status:x.status,level:x.level,recipe:x.standardRecipe?.materials,recipeStatus:x.recipeStatus,gearSlot:x.gearSlot,setName:x.setName})).slice(0,44)));
          console.log("PUBLIC_FILES",JSON.stringify(["typhoeus/cover.webp","typhoeus/illustration.webp","typhoeus/skills/skill-basic.webp","typhoeus/skills/skill-battle.webp","typhoeus/skills/skill-combo.webp","typhoeus/skills/skill-ultimate.webp"].map(n=>({name:n,exists:fs.existsSync("public/images/endfield/operators/"+n)}))));
          NODE
      - name: Inspect user-supplied publicly accessible Mobalytics author page
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          url="https://mobalytics.gg/arknights-endfield/profile/ag0n1st-aodh5g/characters/197f5164-a4a3-4870-9450-37497ae0a819"
          try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36","Accept":"text/html"})
            with urllib.request.urlopen(req,timeout=30) as f:
              b=f.read(5_000_000)
              s=b.decode("utf-8","replace")
              print("MOBALYTICS_HTTP",f.status,"bytes",len(b),"finalHost",urllib.parse.urlparse(f.url).hostname)
              print("MOBALYTICS_HTML_MARKERS",[(term,s.lower().count(term.lower())) for term in ["Typhoeus","Ag0n1st","Deep Rampart","__NEXT_DATA__","Cloudflare","Access Denied"]])
              for term in ["Typhoeus","Deep Rampart","Ag0n1st"]:
                i=s.lower().find(term.lower())
                if i>=0:print("MOBALYTICS_SAMPLE_"+term,html.unescape(re.sub(r'<[^>]*>',' ',s[max(0,i-180):i+220])).strip()[:400])
          except Exception as e: print("MOBALYTICS_UNAVAILABLE",type(e).__name__,str(e)[:300])
          PY
