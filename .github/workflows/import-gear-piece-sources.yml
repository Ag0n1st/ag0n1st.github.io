name: Import exact individual Gear source locations
on:
  push:
    branches: [endfield-exact-gear-locations-20261015]
    paths:
      - scripts/endfield/import-gear-piece-sources.mjs
      - .github/workflows/import-gear-piece-sources.yml

permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Import per-item sources and reconcile with 258 official Gear IDs
        run: node scripts/endfield/import-gear-piece-sources.mjs
      - name: Run Endfield tests, budget and Astro build
        run: |
          npm run test:endfield
          node scripts/endfield/check-budget.mjs
          npm run build
      - name: Save source-attributed individual Gear locations
        shell: bash
        run: |
          git add src/data/endfield/progression/gear-piece-acquisition-sources.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record individually named community Gear acquisition sources'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
