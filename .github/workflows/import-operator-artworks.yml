name: Cache community operator wiki headers (branch only)
on:
  push:
    branches: [feature/endfield-nav-speedruns-countdown-artworks-20261017]
    paths:
      - scripts/endfield/import-operator-artworks.py
      - .github/workflows/import-operator-artworks.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    if: github.repository == 'Ag0n1st/ag0n1st.github.io'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install temporary image converter
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Import individually named public wiki header artwork
        run: python scripts/endfield/import-operator-artworks.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce Endfield 100 MB budget BEFORE commit
        run: node scripts/endfield/check-budget.mjs
      - name: Commit only approved local images and their provenance manifest to current feature branch
        shell: bash
        run: |
          git add -A public/images/endfield/operators/ src/data/endfield/catalog/operator-artwork-sources.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets(endfield): locally cache individually verified wiki operator headers as WebP"
            git pull --rebase origin feature/endfield-nav-speedruns-countdown-artworks-20261017
            git push origin HEAD:feature/endfield-nav-speedruns-countdown-artworks-20261017
          fi
