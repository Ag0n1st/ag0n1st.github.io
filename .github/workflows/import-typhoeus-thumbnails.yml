name: One-time Typhoeus video thumbnail import
on:
  push:
    branches: [feature-typhoeus-complete-guide-20261016]
    paths: [.github/workflows/import-typhoeus-thumbnails.yml]
permissions:
  contents: write
jobs:
  import_images:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/endfield/import-typhoeus-video-thumbnails.mjs
      - run: node scripts/endfield/check-budget.mjs
      - name: Commit only optimized local thumbnails
        shell: bash
        run: |
          git add public/images/endfield/video-thumbnails/{wNVJkGzkfMg,Zw8B2F2nJP8,uixHyNlbwAQ}.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cache three verified Ag0n1st Typhoeus video thumbnails"
          git push origin HEAD:feature-typhoeus-complete-guide-20261016
