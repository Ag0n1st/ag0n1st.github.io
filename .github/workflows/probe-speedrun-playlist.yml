name: Temporary public YouTube playlist endpoint probe
on:
  push:
    branches: [feature/guide-template-countdown-speedruns-20261017]
    paths:
      - .github/workflows/probe-speedrun-playlist.yml
      - scripts/endfield/probe-speedrun-playlist.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check user-provided public playlist endpoints without credentials
        run: python3 scripts/endfield/probe-speedrun-playlist.py
