name: One-time Si Datafield source audit
on:
  push:
    branches: [feature-si-complete-guide-20261016]
    paths: [.github/workflows/audit-si-datafield-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Render public Datafield Si character profile, without authentication
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            pg=b.new_page(viewport={"width":1450,"height":950})
            try:
              r=pg.goto("https://datafield.cc/characters/si",wait_until="domcontentloaded",timeout=60000)
              print("SI_DF_HTTP",r.status if r else None)
              pg.wait_for_timeout(9000)
              for button in pg.get_by_role("button",name="×").all()[:2]:
                try:button.click(timeout=1000)
                except:pass
              txt=pg.locator("body").inner_text()
              print("SI_DF_BODY_BEGIN")
              print(txt[:26000])
              print("SI_DF_BODY_END")
              print("SI_DF_BUTTONS",json.dumps(pg.locator("button").all_text_contents()[:85]))
              if "Show 3 More Weapons" in txt:
                try:pg.get_by_role("button",name="Show 3 More Weapons").first.click(timeout=2500)
                except Exception as e:print("NO_EXPAND",str(e)[:120])
                print("SI_DF_EXPANDED",pg.locator("body").inner_text()[:26000])
            except Exception as e:print("SI_DF_UNAVAILABLE",type(e).__name__,str(e)[:240])
            finally:b.close()
          PY
