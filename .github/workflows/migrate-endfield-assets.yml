name: Relocate unchanged Endfield WebP assets by category

on:
  push:
    branches: [endfield-category-asset-layout-20261015]
    paths:
      - scripts/endfield/migrate-asset-layout.mjs
      - .github/workflows/migrate-endfield-assets.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full candidate branch for rename detection
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rename existing WebPs without modifying any bytes
        run: node scripts/endfield/migrate-asset-layout.mjs
      - name: Install dependencies and verify every image reference
        run: |
          npm ci
          npm run test:endfield
          node scripts/endfield/check-budget.mjs
          npm run build
      - name: Stage byte-identical image renames and both official catalog snapshots
        shell: bash
        run: |
          git add -A -- public/images/endfield src/data/endfield/catalog/items.json src/data/endfield/catalog/equipment-details.json
          git diff --cached --stat | tail -n 12
          echo 'Migration uses the original Git binary blobs; no image re-encoding.'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Relocate original SKPORT WebP blobs by type and update static references'
          git push origin "HEAD:${GITHUB_REF_NAME}"
