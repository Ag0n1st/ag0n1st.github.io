name: Probe public SKPORT Liino wiki

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Validated Liino game data wirklich nach main übertragen?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install public browser runner
        run: |
          npm install --no-save --package-lock=false playwright-core
          google-chrome --version
      - name: Inspect official Liino entry anonymously
        id: inspect
        continue-on-error: true
        run: node scripts/endfield/probe-liino-wiki.mjs
      - name: Validate Liino using the generic Endfield importer
        id: normalize
        continue-on-error: true
        run: |
          node scripts/endfield/import-operator.mjs \
            --input local-data/skport/liino-public-snapshot.json \
            --items local-data/skport/public-items-index.json \
            --id 1041 --slug liino --snapshot "$(date -u +%F)" \
            --out-dir local-data/generated
      - name: Summarize normalized Liino public data
        if: steps.normalize.outcome == 'success'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const a=JSON.parse(fs.readFileSync("local-data/generated/liino.json","utf8"));
            const b=JSON.parse(fs.readFileSync("local-data/generated/liino.extra.json","utf8"));
            console.log(JSON.stringify({
              operator:a.operator,skills:a.skills.map(x=>({
                slot:x.slot,name:x.name,metrics:x.metrics.length,ranks:x.upgradeCosts.length
              })),
              attributeLevels:b.attributes.levels,
              talents:b.talents.map(x=>({name:x.name,category:x.category,stages:x.levels.length})),
              promotions:b.promotions.map(x=>x.name),
              potentials:b.potentials.map(x=>x.name),
              materialCount:Object.keys(b.materials).length
            },null,2));
          '
      - name: Verify normalized records before publishing
        if: steps.normalize.outcome == 'success' && inputs.publish == true
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const a=JSON.parse(fs.readFileSync("local-data/generated/liino.json","utf8"));
            const b=JSON.parse(fs.readFileSync("local-data/generated/liino.extra.json","utf8"));
            if(a.operator.id!=="1041" || a.operator.slug!=="liino" || a.operator.name!=="Liino" ||
              a.operator.rarity!==6 || a.skills.length!==4 ||
              new Set(a.skills.map(s=>s.slot)).size!==4 ||
              a.skills.some(s=>s.metrics.length<1 || s.metrics.some(metric=>metric.length!==13) || s.upgradeCosts.length!==12) ||
              b.potentials.length!==5 || b.talents.length<3 || b.promotions.length<4 ||
              b.source.itemId!=="1041" || b.operator!=="liino") {
              throw new Error("Official Liino data failed prepublication checks");
            }
          '
          mkdir -p src/data/endfield/operators
          cp local-data/generated/liino.json src/data/endfield/operators/liino.json
          cp local-data/generated/liino.extra.json src/data/endfield/operators/liino.extra.json
      - name: Verify complete Astro build with Liino data
        if: steps.normalize.outcome == 'success' && inputs.publish == true
        run: |
          npm install
          npm run test:endfield
          npm run build
      - name: Commit only validated public Liino data
        if: steps.normalize.outcome == 'success' && inputs.publish == true
        id: commit
        shell: bash
        run: |
          git add src/data/endfield/operators/liino.json src/data/endfield/operators/liino.extra.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import verified official SKPORT Liino operator data"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Liino artwork and publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-endfield-assets.yml --ref main
      - name: Upload only sanitized public wiki responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liino-skport-public-only
          path: |
            local-data/skport/liino-public-snapshot.json
            local-data/skport/public-items-index.json
            local-data/generated/liino.json
            local-data/generated/liino.extra.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Report unavailability
        if: steps.inspect.outcome != 'success'
        run: |
          echo "::warning::No reliable public SKPORT Liino snapshot obtained. Import remains blocked."
