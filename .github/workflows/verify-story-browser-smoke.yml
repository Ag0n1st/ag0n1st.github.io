name: Browser-check Endfield story progress
on:
  push:
    branches: [endfield-story-area-build-filter-20261015]
    paths:
      - scripts/endfield/verify-story-browser-smoke.mjs
      - .github/workflows/verify-story-browser-smoke.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          npm install --no-save --package-lock=false playwright-core
      - run: npm run build
      - name: Start Astro preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/story-browser-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/endfield/operatoren/liino/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/story-browser-preview.log
          exit 1
      - run: node scripts/endfield/verify-story-browser-smoke.mjs
