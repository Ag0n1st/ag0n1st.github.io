name: Verify last four official basic gear recipes

on:
  push:
    branches: [endfield-official-weapon-gear-details-20261015]
    paths:
      - scripts/endfield/fix-basic-recipes.mjs
      - .github/workflows/fix-basic-recipes.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          npm install --no-save --package-lock=false playwright-core
      - name: Confirm late material labels in four official early gear pages
        run: node scripts/endfield/fix-basic-recipes.mjs
      - name: Validate all source values, budget, and full Astro build
        run: |
          npm run test:endfield
          node scripts/endfield/check-budget.mjs
          npm run build
      - name: Commit strictly verified official material quantities to PR branch
        shell: bash
        run: |
          git add src/data/endfield/catalog/equipment-details.json
          if git diff --cached --quiet; then
            echo 'No recipe updates'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Complete all 258 official SKPORT default gear crafting recipes'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
