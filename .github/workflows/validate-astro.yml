name: Validate Astro and operator guides

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and data validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Test Endfield data importers
        run: npm run test:endfield
      - name: Enforce 100 MB Endfield project budget
        run: node scripts/endfield/check-budget.mjs
      - name: Build Astro website
        run: npm run build
      - name: Enforce 1 GB deployable GitHub Pages site budget
        run: node scripts/check-pages-budget.mjs
      - name: Set up Python for real Chromium browser QA
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install temporary Playwright test runner and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Smoke test built Liino and Typhoeus pages (desktop and mobile)
        run: python scripts/endfield/browser-smoke.py
