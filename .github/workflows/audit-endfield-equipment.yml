name: Validate final official Endfield equipment snapshot

on:
  push:
    branches: [endfield-official-weapon-gear-details-20261015]
    paths:
      - scripts/endfield/audit-equipment.mjs
      - .github/workflows/audit-endfield-equipment.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate official equipment states without any wiki requests
        run: node scripts/endfield/audit-equipment.mjs
      - name: Test, enforce 100 MB budget and build
        run: |
          npm run test:endfield
          node scripts/endfield/check-budget.mjs
          npm run build
      - name: Commit validated metadata to feature branch only
        shell: bash
        run: |
          git add src/data/endfield/catalog/equipment-details.json
          if git diff --cached --quiet; then
            echo 'Official metadata unchanged'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Mark gear with official stats as verified even without Artificing'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
