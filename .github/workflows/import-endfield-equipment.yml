name: Probe official SKPORT weapon and gear details

on:
  push:
    branches: [endfield-official-weapon-gear-details-20261015]
    paths:
      - scripts/endfield/equipment-normalize.mjs
      - scripts/endfield/equipment-normalize.test.mjs
      - scripts/endfield/import-equipment.mjs
      - .github/workflows/import-endfield-equipment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies and Chrome runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright-core
          google-chrome --version
      - name: Test local normalization
        run: node --test scripts/endfield/equipment-normalize.test.mjs
      - name: Retrieve a small set of anonymous public SKPORT details
        run: node scripts/endfield/import-equipment.mjs --limit 3
      - name: Upload sanitized normalized sample, never raw browser sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skport-equipment-normalized-sample
          path: local-data/endfield-equipment.json
          if-no-files-found: ignore
          retention-days: 2
