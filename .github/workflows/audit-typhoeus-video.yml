name: One-time public Typhoeus guide video identification
on:
  push:
    branches: [feature-typhoeus-complete-guide-20261016]
    paths: [.github/workflows/audit-typhoeus-video.yml]
permissions:
  contents: read
jobs:
  youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install public metadata-only YouTube search
        run: python3 -m pip install --break-system-packages 'yt-dlp>=2026.3.17'
      - name: Search public videos by channel and guide topic (no video downloads)
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json
          queries=["ytsearch8:Ag0n1st Typhoeus Guide Arknights Endfield","ytsearch8:Typhi Ag0n1st Guide deutsch"]
          for query in queries:
            p=subprocess.run(["yt-dlp","--skip-download","--flat-playlist","--dump-json","--playlist-end","8",query],capture_output=True,text=True,timeout=160)
            print("QUERY",query,"CODE",p.returncode,"ERROR",p.stderr[-500:])
            for line in p.stdout.splitlines()[:8]:
              try:
                j=json.loads(line)
                print("VIDEO",json.dumps({"id":j.get("id"),"title":j.get("title"),"channel":j.get("channel"),"uploader":j.get("uploader"),"duration":j.get("duration"),"url":j.get("url")},ensure_ascii=False))
              except Exception:pass
          PY
